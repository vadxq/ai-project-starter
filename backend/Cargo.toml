[package]
name = "starter-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
default-run = "starter-api"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = "9.3.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rust-i18n = "3.1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.4", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"

[profile.release]
lto = "thin"
