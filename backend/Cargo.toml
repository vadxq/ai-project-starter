[package]
name = "rust-axum-starter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
default-run = "rust-axum-starter"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15.27", default-features = false }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "chrono", "migrate", "uuid", "macros"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
argon2 = "0.5.3"
jsonwebtoken = "9.3.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rust-i18n = "3.1.5"
sha2 = "0.10"
thiserror = "2.0"
utoipa = { version = "5.4", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serial_test = "4.0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[lints.rust]
unsafe_code = "forbid"
