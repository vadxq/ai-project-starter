services:
  postgres:
    image: postgres:18.6
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 3s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:26.7.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: starter_root
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter
      MYSQL_DATABASE: starter
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  mysql_data:
