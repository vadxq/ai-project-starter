server {
    listen 8088;
    root /var/www/starter/dist;
    location /api/ {
        # 原生 API 监听本机 8080；连接失败保留网关错误，不回退 HTML。
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
